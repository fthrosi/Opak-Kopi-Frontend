server {
  listen 80;
  server_name localhost;

  # Lokasi root tempat file statis disimpan
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Ini adalah bagian terpenting untuk Single Page Application (SPA) seperti React.
    # Jika file atau direktori yang diminta tidak ditemukan,
    # kembalikan ke index.html.
    try_files $uri $uri/ /index.html;
  }

  # Aturan untuk caching file statis agar lebih cepat
  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}